[project]
name = "docx2latex"
version = "0.1.0"
description = "Convert DOCX research/review papers into LaTeX projects for popular publisher formats (IEEE, ACM, Springer LNCS, Elsevier, plain article)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "streamlit>=1.30.0",
]

[project.scripts]
docx2latex = "docx2latex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docx2latex"]
